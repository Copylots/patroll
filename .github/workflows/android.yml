name: Android CI Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Prepare Signing Keystore
      env:
        KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      run: |
        if [ -n "$KEYSTORE_BASE64" ]; then
          echo "Decoding keystore from GitHub Secrets..."
          echo "$KEYSTORE_BASE64" | base64 --decode > debug.keystore
        elif [ -f "debug.keystore.base64" ]; then
          echo "Decoding keystore from workspace base64..."
          cat debug.keystore.base64 | base64 --decode > debug.keystore
        else
          echo "No keystore source found, dynamically generating a new debug.keystore..."
          keytool -genkey -v -keystore debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        fi

    - name: Build Debug APK
      run: gradle :app:assembleDebug --no-daemon

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Buku-Patroli-Security-APK
        path: app/build/outputs/apk/debug/app-debug.apk
